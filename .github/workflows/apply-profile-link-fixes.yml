name: Apply profile figure and article links

on:
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/apply-profile-link-fixes.yml"

permissions:
  contents: write

jobs:
  patch-profile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch profile README
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          linkedin_url = "https://www.linkedin.com/pulse/quantum-turing-patterns-kazuki-ikeda-373ic/"
          feature_old = """[![Lean 4](https://img.shields.io/badge/Formalization-Lean_4-7B2CBF?style=for-the-badge)](https://github.com/IKEDAKAZUKI/Quantum-Turing-Pattern/tree/main/lean4%20formalization)

[![Labyrinth movie]"""
          feature_new = f"""[![Lean 4](https://img.shields.io/badge/Formalization-Lean_4-7B2CBF?style=for-the-badge)](https://github.com/IKEDAKAZUKI/Quantum-Turing-Pattern/tree/main/lean4%20formalization)

[![Popular article](https://img.shields.io/badge/LinkedIn-Research_story-0A66C2?style=for-the-badge&logo=linkedin&logoColor=white)]({linkedin_url})

**[How I conceived the research, what was solved, and why it is exciting.]({linkedin_url})**

[![Labyrinth movie]"""

          pdf_url = "https://github.com/IKEDAKAZUKI/Entangling-Topological-Invariants/blob/main/entangling-topological-invariants/figures/fig1_zero_marginal.pdf"
          preview_url = "https://raw.githubusercontent.com/IKEDAKAZUKI/Entangling-Topological-Invariants/main/entangling-topological-invariants/figures/fig1_zero_marginal_profile.webp"
          card_old = """<a href=\"https://github.com/IKEDAKAZUKI/Entangling-Topological-Invariants\">
  <img width=\"100%\" src=\"https://github.com/IKEDAKAZUKI/Entangling-Topological-Invariants/blob/main/entangling-topological-invariants/figures/fig1_zero_marginal.pdf\" alt=\"Mixed Chern, cross-pump, second-Chern, and tomography preview\">
</a>
<h3 align=\"center\"><a href=\"https://github.com/IKEDAKAZUKI/Entangling-Topological-Invariants\">Entangling Topological Invariants</a></h3>
<p align=\"center\">Mixed-Chern geometry · quantized cross pumping · second Chern class · tomography</p>"""
          card_new = f"""<a href=\"{pdf_url}\">
  <img width=\"100%\" src=\"{preview_url}\" alt=\"Figure 1: one-label Chern responses and mixed Berry curvature\">
</a>
<h3 align=\"center\"><a href=\"https://github.com/IKEDAKAZUKI/Entangling-Topological-Invariants\">Entangling Topological Invariants</a></h3>
<p align=\"center\">One-label Chern responses · mixed Berry curvature · <a href=\"{pdf_url}\">original vector PDF</a></p>"""

          changed = False
          if feature_old in text:
              text = text.replace(feature_old, feature_new, 1)
              changed = True
          elif linkedin_url not in text:
              raise SystemExit("Could not locate the Quantum Turing Patterns badge block")

          if card_old in text:
              text = text.replace(card_old, card_new, 1)
              changed = True
          elif preview_url not in text:
              raise SystemExit("Could not locate the Entangling Topological Invariants card")

          if changed:
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Fix Figure 1 preview and add LinkedIn article"
          git push origin HEAD:${{ github.head_ref }}
